name: Nexus Network Move Build and Attest

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    outputs:
      payload-artifact: nexus-publish-payload.json

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Aptos CLI Toolchain
        run: |
          npm install @aptos-labs/aptos-cli
          npx aptos --install

      - name: Initialize Aptos Profile
        run: |
          npx aptos init \
            --network testnet \
            --assume-yes \
            --profile default

      - name: Compile and Build Publish Payload
        run: |
          mkdir -p sources
          npx aptos move build-publish-payload \
            --package-dir . \
            --json-output-file nexus-publish-payload.json \
            --included-artifacts all \
            --assume-yes

      - name: Generate Secure Build Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "nexus-publish-payload.json"

      - name: Upload Attested Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-move-build
          path: nexus-publish-payload.json

  # NEW: Continuous Deployment Execution Block
  deploy-testnet:
    needs: build-and-attest
    # Only deploy when code is integrated into the main tracking branch
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Aptos CLI Toolchain
        run: |
          npm install @aptos-labs/aptos-cli
          npx aptos --install

      - name: Download Verified Artifact Package
        uses: actions/download-artifact@v4
        with:
          name: nexus-move-build

      # Submits the pre-compiled, attested transaction payload securely using your secret key vault
      - name: Execute On-Chain Contract Publication
        env:
          APTOS_PRIVATE_KEY: ${{ secrets.APTOS_PRIVATE_KEY }}
        run: |
          if [ -z "$APTOS_PRIVATE_KEY" ]; then
            echo "❌ Error: APTOS_PRIVATE_KEY secret is not set in GitHub repository settings."
            exit 1
          fi
          
          # Initialize profile on the runner using the secure secret environment variable
          npx aptos init \
            --network testnet \
            --private-key "$APTOS_PRIVATE_KEY" \
            --assume-yes \
            --profile deployer_profile
          
          # Publish the exact payload attested in the previous job
          npx aptos move publish \
            --package-dir . \
            --assume-yes \
            --profile deployer_profile
