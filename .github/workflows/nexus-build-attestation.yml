name: Nexus Network Build and Attest

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-attest:
    runs-on: ubuntu-latest

    # MANDATORY: These permissions are strictly required for Sigstore OIDC token 
    # exchange and generation of the cryptographically signed attestation file.
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Aligned with your tsconfig node20/node16 modules
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Nexus Network Artifacts
        run: npm run build

      # Step 3: Bundle your dist directories into a single zip/tar for attestation.
      # This treats the built package as a single verifiable subject.
      - name: Package Build Artifacts
        run: |
          tar -czf nexus-network-build.tar.gz ./dist/

      # Step 4: Generate the Secure Attestation Provenance
      - name: Generate Artifact Attestation
        uses: actions/attest@v4
        with:
          subject-path: 'nexus-network-build.tar.gz'
          # Optional: you can add a custom predicate-type if utilizing specific SLSA requirements

      # Optional: Upload the signed artifact to GitHub Actions summary for downloads
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-network-release
          path: nexus-network-build.tar.gz
