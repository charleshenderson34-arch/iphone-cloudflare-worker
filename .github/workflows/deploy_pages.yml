mkdir -p .github/workflows && cat << 'EOF' > .github/workflows/deploy-pages.yml
name: Deploy Aptos dApp to Cloudflare Pages

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dApp
        run: npm run build
        env:
          NEXT_PUBLIC_APTOS_NETWORK: mainnet # Change to testnet/devnet if needed

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=my-aptos-dapp
EOF
