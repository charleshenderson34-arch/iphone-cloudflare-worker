name: Nexus Network Move Build and Attest

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-attest:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Aptos CLI Toolchain
        run: |
          npm install @aptos-labs/aptos-cli
          npx aptos --install

      - name: Initialize Aptos Profile
        run: |
          npx aptos init \
            --network testnet \
            --assume-yes \
            --profile aptos

      # FIXED: Safely searches for the manifest case-insensitively. 
      # If missing, it prints the repository tree instead of crashing.
      - name: Compile and Build Publish Payload
        run: |
          FOUND_PATH=$(find . -iname "Move.toml" -print -quit)
          
          if [ -z "$FOUND_PATH" ]; then
            echo "=========================================================="
            echo "❌ ERROR: Could not find Move.toml anywhere in the repository!"
            echo "Showing visible files in your repository:"
            echo "=========================================================="
            find . -maxdepth 3 -not -path '*/.*' -not -path './node_modules*'
            exit 1
          fi

          MOVE_DIR=$(dirname "$FOUND_PATH")
          echo "✅ Found Move contract manifest folder in: $MOVE_DIR"
          
          npx aptos move build-publish-payload \
            --package-dir "$MOVE_DIR" \
            --json-output-file nexus-publish-payload.json \
            --included-artifacts all \
            --assume-yes

      - name: Generate Secure Build Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "nexus-publish-payload.json"

      - name: Upload Attested Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-move-build
          path: nexus-publish-payload.json
