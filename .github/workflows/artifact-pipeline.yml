name: Nexus Network Move Build and Attest

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-attest:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Install Aptos CLI tool wrapper locally
      - name: Install Aptos CLI Toolchain
        run: |
          npm install @aptos-labs/aptos-cli
          npx aptos --install

      # FIXED: Running with "npx aptos" instead of referencing explicit shell locations, 
      # and targeting the workspace directory for the Move configuration search framework.
      - name: Compile and Build Publish Payload
        run: |
          npx aptos move build-publish-payload \
            --package-dir . \
            --json-output-file nexus-publish-payload.json \
            --included-artifacts sparse \
            --assume-yes

      # Generate the Cryptographic Build Provenance using GitHub Attestations
      - name: Generate Secure Build Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "nexus-publish-payload.json"

      # Archive the verified artifact for your deployment pipeline
      - name: Upload Attested Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-move-build
          path: nexus-publish-payload.json
