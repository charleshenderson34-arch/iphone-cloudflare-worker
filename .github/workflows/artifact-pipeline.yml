name: Nexus Network Move Build and Attest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-attest:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup environment using modern Node 24 standard
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Install Aptos CLI tool wrapper locally
      - name: Install Aptos CLI Toolchain
        run: |
          npm install @aptos-labs/aptos-cli
          npx aptos --install

      # Initialise the Aptos local configuration context
      - name: Initialize Aptos Profile
        run: |
          npx aptos init \
            --network testnet \
            --assume-yes \
            --profile default

      # Compiles FraxGovernance and fetches the aptos-framework Git dependency
      - name: Compile and Build Publish Payload
        run: |
          npx aptos clean
          npx aptos move build-publish-payload \
            --save-metadata
            --package-dir /private/var/root/attest-build-provenance \
            --json-output-file /Users/stevendyke/out/nexus_publish_payload.json \
            --included-artifacts all \
            --assume-yes

      # Cryptographically ties your payload to your GitHub Repository profile
      - name: Generate Secure Build Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "/private/var/root/attest-build-provenance/nexus-publish-payload.json"

      # Export the final attested asset bundle
      - name: Upload Attested Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-move-build
          path:/private/var/root/attest-build-provenance/nexus-publish-payload.json
