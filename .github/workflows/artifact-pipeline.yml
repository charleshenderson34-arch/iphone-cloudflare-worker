name: Contract Artifact Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the source repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Setup Node.js workspace environment
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. Install Foundry (Forge CLI suite)
      - name: Install Foundry Suite
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # 4. Initialize package layer, Wrangler configuration, and KV Bindings on the fly
      - name: Initialize App Workspace and wrangler.toml Matrix
        run: |
          npm init -y
          npm install wrangler child_process fs path
          npm install-scripts approve --all
          # Force create a production wrangler.toml file mapping out your active configurations
          cat <<EOF > wrangler.toml
          name = "aptos-artifact-pipeline"
          compatibility_date = "2026-09-16"
          
          kv_namespaces = [
            { binding = "aptos_artifacts", id = "PENDING_AUTO_ASSIGNMENT" }
          ]
          EOF
          
          console.log("Dynamically initialized clean environment configs with KV binding maps.");

      # 5. Execute your deployment pipeline
      - name: Execute Build and Infrastructure Sync Pipeline
        run: node pipeline.js
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
