name: Nexus Network Move Build and Attest

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-attest:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Install Aptos CLI tool wrapper locally
      - name: Install Aptos CLI Toolchain
        run: |
          npm install @aptos-labs/aptos-cli
          npx aptos --install

      # Initialise the Testnet profile matching your parameters
      - name: Initialize Aptos Profile
        run: |
          npx aptos init \
            --network testnet \
            --assume-yes \
            --profile aptos

      # FIXED: Automatically finds where Move.toml resides and compiles it dynamically
      - name: Compile and Build Publish Payload
        run: |
          MOVE_DIR=$(dirname $(find . -name "Move.toml" -print -quit))
          if [ -z "$MOVE_DIR" ] || [ "$MOVE_DIR" = "." ]; then
            echo "Move.toml not found in subdirectories. Trying root directory..."
            MOVE_DIR="."
          fi
          echo "Found Move contract manifest folder in: $MOVE_DIR"
          
          npx aptos move build-publish-payload \
            --package-dir "$MOVE_DIR" \
            --json-output-file nexus-publish-payload.json \
            --included-artifacts all \
            --assume-yes

      # Generate the Cryptographic Build Provenance using GitHub Attestations
      - name: Generate Secure Build Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "nexus-publish-payload.json"

      # Archive the verified artifact for your deployment pipeline
      - name: Upload Attested Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-move-build
          path: nexus-publish-payload.json
